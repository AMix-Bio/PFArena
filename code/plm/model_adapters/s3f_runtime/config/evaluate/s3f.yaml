task:
  class: ResidueTypePrediction
  mask_rate: 0.15
  dropout: 0.5
  plddt_threshold: 70
  model:
    class: FusionNetwork
    sequence_model:
      class: MyESM
      path: model-resources/esm2
      model: ESM-2-650M
    structure_model:
      class: SurfGVP
      node_in_dim: [1280, 0]
      node_h_dim: [256, 16]
      edge_in_dim: [16, 1]
      edge_h_dim: [64, 1]
      surf_in_dim: [42, 0]
      surf_edge_in_dim: [16, 1]
      num_surf_res_neighbor: 3
      num_surf_graph_neighbor: 16
      num_layers: 5
      vector_gate: True
      readout: mean
      drop_rate: 0.1
  graph_construction_model:
    class: GraphConstruction
    node_layers:
      - class: AlphaCarbonNode
    edge_layers:
      - class: SpatialEdge
        radius: 10.0
        min_distance: 0
    edge_feature: null
